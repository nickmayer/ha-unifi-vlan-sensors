name: Release

on:
  push:
    tags:
      - "*-vlan.*"   # e.g. 2026.10.0-vlan.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unifi.zip with a unique manifest version
        run: |
          # 2026.10.0-vlan.1 -> 2026.10.0.1
          VERSION="${GITHUB_REF_NAME/-vlan./.}"
          cp -r custom_components/unifi /tmp/unifi
          python3 - "$VERSION" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("/tmp/unifi/manifest.json")
          m = json.loads(p.read_text())
          m["version"] = sys.argv[1]
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY
          (cd /tmp/unifi && zip -qr "$GITHUB_WORKSPACE/unifi.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          files: unifi.zip
          generate_release_notes: true
